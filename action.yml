name: "GuardSmith Lint"
description: >-
  Machine-verify AI development standards (CLAUDE.md / agents / skills)
  with SARIF upload and PR comments on violations.
author: "Novexar"
branding:
  icon: "shield"
  color: "purple"

inputs:
  cli-version:
    description: "@guardsmith/cli version to run (npm)"
    required: false
    default: "0.2.1"
  guardsmith-token:
    description: >-
      Token used to fetch remote policy/standards repos referenced via
      github: refs. Defaults to github.token, which is enough for public
      repos; pass a PAT to resolve private overlay repositories.
    required: false
    default: ${{ github.token }}
  github-token:
    description: "Token used to post the PR comment (needs pull-requests: write)"
    required: false
    default: ${{ github.token }}
  root:
    description: "Directory to lint, relative to the workspace"
    required: false
    default: "."
  policy:
    description: "Policy file, relative to root"
    required: false
    default: "guard.policy.yaml"
  upload-sarif:
    description: >-
      Upload the SARIF report to GitHub Code Scanning (requires a public repo
      or GitHub Advanced Security). Set to 'false' on private repos without GHAS.
    required: false
    default: "true"
  pr-comment:
    description: "Post a summary comment on the PR when lint fails"
    required: false
    default: "true"

outputs:
  exit-code:
    description: "guard lint exit code (0 = pass, 1 = errors found)"
    value: ${{ steps.lint.outputs.exit-code }}
  sarif-file:
    description: "Path to the generated SARIF report in the workspace"
    value: "guardsmith.sarif"

runs:
  using: "composite"
  steps:
    - name: Run guard lint
      id: lint
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.guardsmith-token }}
        CLI_VERSION: ${{ inputs.cli-version }}
        LINT_ROOT: ${{ inputs.root }}
        LINT_POLICY: ${{ inputs.policy }}
      run: |
        set +e
        root="$GITHUB_WORKSPACE/$LINT_ROOT"
        npx -y "@guardsmith/cli@$CLI_VERSION" lint \
          --root "$root" --policy "$LINT_POLICY" | tee "$GITHUB_WORKSPACE/guardsmith-report.txt"
        code=${PIPESTATUS[0]}
        npx -y "@guardsmith/cli@$CLI_VERSION" lint \
          --root "$root" --policy "$LINT_POLICY" \
          --format sarif --out "$GITHUB_WORKSPACE/guardsmith.sarif" > /dev/null
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        {
          echo "## 🛡️ GuardSmith lint"
          echo '```'
          cat "$GITHUB_WORKSPACE/guardsmith-report.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit 0

    - name: Upload SARIF to Code Scanning
      if: ${{ always() && inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: guardsmith.sarif

    - name: Upload SARIF artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: guardsmith-sarif
        path: guardsmith.sarif

    - name: Comment on PR
      if: ${{ inputs.pr-comment == 'true' && github.event_name == 'pull_request' && steps.lint.outputs.exit-code != '0' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        {
          echo "### 🛡️ GuardSmith lint failed"
          echo
          echo '```'
          tail -n 40 "$GITHUB_WORKSPACE/guardsmith-report.txt"
          echo '```'
          echo
          echo "_Fix the findings above, or add a time-boxed exemption in \`guard.policy.yaml\` (expires + approved_by required)._"
        } > "$GITHUB_WORKSPACE/guardsmith-comment.md"
        gh pr comment "${{ github.event.pull_request.number }}" \
          --repo "${{ github.repository }}" \
          --body-file "$GITHUB_WORKSPACE/guardsmith-comment.md"

    - name: Fail on lint errors
      shell: bash
      run: exit ${{ steps.lint.outputs.exit-code }}
