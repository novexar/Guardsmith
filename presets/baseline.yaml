# GuardSmith baseline — novexar/claude-standards の規約を機械判定化したルールセット
# 対象: claude-standards テンプレートから生成されたプロジェクトリポジトリ
version: 1
target: claude-code
rules:
  # --- 標準構成の存在保証 ---
  - id: structure/required-layout
    severity: error
    description: 標準リポジトリ構成(CLAUDE.md / agents / skills / docs)が存在すること
    check: file-exists
    with:
      paths:
        - CLAUDE.md
        - .claude/agents/*.md
        - .claude/skills/start-task/SKILL.md
        - .claude/skills/finish-task/SKILL.md
        - docs/

  # --- 初期化完了の検証 (init-project の完了条件) ---
  - id: claude-md/initialized
    severity: error
    description: 未初期化テンプレートのまま運用されていないこと(プレースホルダ・警告ブロック・gen:コメントの残存禁止)
    check: content-match
    with:
      path: CLAUDE.md
      must_not:
        - '\{\{.*\}\}'
        - "未初期化テンプレート"
        - "<!-- gen:"

  - id: agents/no-template-placeholder
    severity: error
    description: agent雛形が具体化されていること(プレースホルダ・gen:コメントの残存禁止)
    check: content-match
    with:
      path: .claude/agents/*.md
      must_not:
        - '\{\{.*\}\}'
        - "<!-- gen:"

  # --- CLAUDE.md 契約見出し (agents/skills が参照するコントラクト。改名・削除禁止) ---
  - id: claude-md/contract-headings
    severity: error
    description: agents/skillsが参照する契約見出しが維持されていること
    check: content-match
    with:
      path: CLAUDE.md
      must:
        - "^## 技術スタック"
        - "^## よく使うコマンド"
        - "^## ブランチ戦略"
        - "^## PJ固有ルール"

  # --- 薄い差分原則 (完成版は120行以内目安) ---
  - id: claude-md/thin-diff
    severity: warn
    description: CLAUDE.mdの肥大化検知(本体行数のみ。常駐量は claude-md/import-budget)
    check: max-lines
    with: { path: CLAUDE.md, limit: 120 }

  # --- 常駐量の可視化と上限 (@インポート先を含む「起動時に読み込まれる総量」) ---
  # 注意: 旧 CLI (<= 0.4.0) は未知の check を strict スキーマで拒否するため、
  #       本ルールを含む baseline は次期タグ (v0.6.0) 以降でのみ配布される。
  - id: claude-md/import-budget
    severity: warn
    description: CLAUDE.md と @インポート先を合わせた常駐量の可視化と上限(行数だけでは軽量と判断しない)
    check: import-budget
    # max_chars 32000 は試行値(≒8,000 tokens 目安)。運用実績を見て調整する
    with: { path: CLAUDE.md, max_chars: 32000 }

  # --- standards バージョントレーサビリティ ---
  - id: claude-md/standards-version
    severity: warn
    description: 末尾のstandardsバージョンコメントが維持されていること(どの標準版から生成されたかの追跡)
    check: content-match
    with:
      path: CLAUDE.md
      must:
        - "<!-- standards: novexar/(claude-standards|guardsmith) v"

  # --- agents frontmatter ---
  - id: agents/frontmatter
    severity: error
    description: agentのfrontmatter必須キー(name/description/tools)
    check: frontmatter
    with:
      paths: [.claude/agents/*.md]
      required: [name, description, tools]
      schema: { name: "^[a-z][a-z0-9-]*$" }

  # --- agents モデル固定禁止 (docs/AGENTS.md のポリシー) ---
  - id: agents/no-pinned-model
    severity: warn
    description: agent定義に日付付きmodel IDをハードコードしない(エイリアスで最新版に解決させる)
    check: content-match
    with:
      path: .claude/agents/*.md
      must_not: ['model:\s*"?claude-[a-z0-9-]+-20\d{6}']

  # --- skills frontmatter ---
  - id: skills/frontmatter
    severity: error
    description: skillのfrontmatter必須キー(name/description)
    check: frontmatter
    with:
      paths: [".claude/skills/*/SKILL.md"]
      required: [name, description]

  # --- 標準skills本体のマスター乖離検知 ---
  - id: drift/skills-sync
    severity: warn
    description: 標準skillsがマスター(standards/)から乖離していないこと
    check: drift
    with:
      # マスターは guardsmith リポジトリの standards/ サブディレクトリ。
      # loadPolicy がタグのtarballを取得・キャッシュし file: に解決してから検査する
      source: github:novexar/guardsmith//standards@v0.7.1
      paths: [".claude/skills/**"]
      allow_sections: ["## PJ固有手順"]

  # --- 標準本体のマスター追随 (3-way: PJ の編集を保ったまま標準の変更だけ取り込む) ---
  # 注意: 旧 CLI (<= 0.5.0) は未知の check を strict スキーマで拒否するため、
  #       本ルールを含む baseline は CLI 0.6.0 以上でのみ利用できる。
  #       判定には guardsmith.vars.yaml(init-project / guard sync --init-vars が生成)が要る。
  - id: drift/standards-sync
    severity: warn
    description: 標準本体(CLAUDE.md / DESIGN.md / docs / agents)が旧タグのまま取り残されていないこと(3-way)
    check: drift3
    with:
      source: github:novexar/guardsmith//standards@v0.7.1
      paths: ["CLAUDE.md", "DESIGN.md", "docs/**/*.md", ".claude/agents/**/*.md"]

  # --- CI/CD 方針 (docs/CI_CD.md: CI はローカル Docker、Actions は main push の deploy のみ) ---
  - id: ci/no-remote-test-workflows
    severity: warn
    description: GitHub Actions にテスト系ワークフローを置かない(CI はローカル Docker。Actions は deploy のみ)
    check: content-match
    with:
      path: .github/workflows/*.yml
      must_not: ['\bpull_request\b', "pnpm test", "npm test", "pytest", "vitest"]

  # --- セキュリティ ---
  - id: security/no-secrets-in-context
    severity: error
    description: CLAUDE.md・.claude配下・vars への資格情報混入禁止
    check: secret-scan
    with:
      paths:
        - CLAUDE.md
        # 置換値の記録(コミット対象)。秘密情報が紛れ込むと必ず流出する経路になる
        - guardsmith.vars.yaml
        - ".claude/**"
        # Claude Code エージェントの一時 worktree(リポジトリ全体のコピーを含む)は対象外。
        # guard 0.4.0 以降は .gitignore 追従で自動的に外れるが、旧 CLI でも効くよう明示する
        - "!.claude/worktrees/**"

  - id: security/dangerous-permissions
    severity: error
    description: settings.jsonの危険なpermission許可の禁止
    check: json-path
    with:
      path: .claude/settings.json
      assert:
        - { query: "$.permissions.allow[*]", op: not-matches, value: 'rm -rf|curl .*\|.*sh' }

  # --- ハイジーン (GuardSmith ランタイム成果物のコミット防止) ---
  - id: hygiene/guardsmith-artifacts-ignored
    severity: warn
    description: GuardSmith のランタイム成果物をコミットしない(.guardsmith/ はリポジトリ名・SHA等のPJ固有情報、settings.local.json は URL/トークンを含むため .gitignore で除外されていること)
    check: content-match
    with:
      path: .gitignore
      must:
        - '^\.guardsmith/'
        - '^\.claude/settings\.local\.json'
