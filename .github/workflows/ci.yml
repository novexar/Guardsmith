# メンテナ自身の CI はローカル Docker(make ci — CONTRIBUTING.md 参照)。
# この workflow は外部コントリビュータ(fork)からの PR 検証専用で、
# 同一リポジトリのブランチからの PR では実行されない。
name: External PR CI

on:
  pull_request:

jobs:
  ci:
    # fork からの PR のみ実行(自リポジトリのブランチ PR ではスキップ)
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint + prettier)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage (80% gate)
        run: pnpm test:coverage

      - name: Self guard lint (dogfooding)
        run: pnpm guard lint
